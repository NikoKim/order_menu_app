# Add this location block to the moment.zsj-unknown.top HTTPS server.
error_page 404 /404.html;
gzip on;
gzip_types application/json application/javascript text/css image/svg+xml;

# Naval realtime upgrades and cacheable game assets.
location /api/entertainment/naval/live {
    proxy_pass https://order-menu-backend.zsj-unknown.top;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host order-menu-backend.zsj-unknown.top;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
}
location /entertainment/naval/ { expires 1d; }
location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

location ~ ^/share/moments/([0-9]+)$ {
    rewrite ^/share/moments/([0-9]+)$ /api/moments/$1/share-card break;
    proxy_pass https://order-menu-backend.zsj-unknown.top;
    proxy_ssl_server_name on;
    proxy_set_header Host order-menu-backend.zsj-unknown.top;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    try_files $uri $uri/ /index.html;
}

location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

location = /404.html {
    internal;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}
