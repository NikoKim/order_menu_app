# Add this location block to the moment.zsj-unknown.top HTTPS server.
error_page 404 /404.html;

location / {
    try_files $uri $uri/ /index.html;
}

location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

location = /404.html {
    internal;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}
