<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>页面未找到 - 香狗动态</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f7f8;
        color: #202124;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      main { width: min(420px, 100%); text-align: center; }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border: 1px solid #ffd7ac;
        border-radius: 8px;
        background: #fff4e8;
        color: #d96f0a;
        font-size: 24px;
        font-weight: 800;
      }
      h1 { font-size: 24px; line-height: 1.35; }
      p { margin-top: 10px; color: #737880; font-size: 15px; line-height: 1.7; }
      a {
        min-height: 46px;
        margin-top: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 22px;
        border-radius: 8px;
        background: #f28c28;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        transition: transform .16s ease, background .16s ease;
      }
      a:hover { background: #df7918; }
      a:active { transform: scale(.97); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">404</div>
      <h1>页面暂时找不到</h1>
      <p>当前链接可能已经失效。请点击下方链接重新加载动态页面。</p>
      <a href="https://moment.zsj-unknown.top/">重新加载 moment.zsj-unknown.top</a>
    </main>
  </body>
</html>
