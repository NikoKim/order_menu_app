components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MomentPageResponse:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/MomentResponse'
          description: 动态数据
        page:
          type: integer
          format: int64
          description: 页码。约束/枚举：从 1 开始
        pageSize:
          type: integer
          format: int64
          description: 每页数量
        total:
          type: integer
          format: int64
          description: 总记录数
        hasMore:
          type: boolean
          description: 是否还有下一页
      required:
      - records
      - page
      - pageSize
      - total
      - hasMore
    CustomerRegisterRequest:
      type: object
      properties:
        nickname:
          type: string
          description: 昵称。约束/枚举：非空，最大 50
        password:
          type: string
          description: 密码。约束/枚举：6~72
      required:
      - nickname
      - password
    RegisterResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          description: 用户 ID
        nickname:
          type: string
          description: 昵称
      required:
      - userId
      - nickname
    LoginRequest:
      type: object
      properties:
        nickname:
          type: string
          description: 昵称。约束/枚举：非空
        password:
          type: string
          description: 密码。约束/枚举：非空
        role:
          type: string
          description: 登录角色。约束/枚举：CUSTOMER / SHOP / ADMIN
      required:
      - nickname
      - password
      - role
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: 访问令牌。约束/枚举：JWT
        user:
          $ref: '#/components/schemas/CurrentUserResponse'
          description: 当前用户
      required:
