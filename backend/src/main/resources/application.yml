server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: order-menu-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      enabled: true
      max-file-size: 30MB
      max-request-size: 32MB
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 1
          max-wait: 1s

mybatis-plus:
  type-aliases-package: com.order.menu.module.*.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  jwt:
    header: Authorization
    token-prefix: Bearer
    expire-seconds: 604800
  upload:
    allowed-extensions: jpg,jpeg,png,webp
    image-url-prefix: /images
    public-base-url: ${ORDER_MENU_PUBLIC_BASE_URL:}
  chat-media:
    base-path: ${ORDER_MENU_CHAT_MEDIA_PATH:/www/server/SpringBoot/order_menu_image/message_chat}
    url-prefix: /message-chat-images
    public-base-url: ${ORDER_MENU_PUBLIC_BASE_URL:}
    max-original-bytes: 20971520
    compress-threshold-bytes: 5242880
    max-pixels: 12000000
  moment-media:
    max-original-bytes: 31457280
    max-moment-bytes: 10485760
    max-comment-bytes: 5242880
    max-pixels: 16000000
    max-source-pixels: 120000000
  push:
    gateway-url: ${ORDER_MENU_PUSH_GATEWAY_URL:}
    gateway-token: ${ORDER_MENU_PUSH_GATEWAY_TOKEN:}
  cors:
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS

order-menu:
  redis:
    enabled: ${ORDER_MENU_REDIS_ENABLED:false}
    environment: ${ORDER_MENU_REDIS_ENV:${SPRING_PROFILES_ACTIVE:dev}}

    menu-cache-enabled: ${ORDER_MENU_MENU_CACHE_ENABLED:false}
    moment-cache-enabled: ${ORDER_MENU_MOMENT_CACHE_ENABLED:false}
    chat-cache-enabled: ${ORDER_MENU_CHAT_CACHE_ENABLED:false}
    unread-cache-enabled: ${ORDER_MENU_UNREAD_CACHE_ENABLED:false}
    idempotency-enabled: ${ORDER_MENU_IDEMPOTENCY_ENABLED:false}
    websocket-bus-enabled: ${ORDER_MENU_WEBSOCKET_BUS_ENABLED:false}

    shop-detail-ttl-seconds: 300
    shop-menu-ttl-seconds: 120
    moment-base-ttl-seconds: 300
    moment-list-ttl-seconds: ${ORDER_MENU_MOMENT_LIST_TTL_SECONDS:120}
    moment-unread-ttl-seconds: ${ORDER_MENU_MOMENT_UNREAD_TTL_SECONDS:60}
    moment-topic-ttl-seconds: ${ORDER_MENU_MOMENT_TOPIC_TTL_SECONDS:300}
    moment-comment-ttl-seconds: ${ORDER_MENU_MOMENT_COMMENT_TTL_SECONDS:120}
    moment-stats-ttl-seconds: ${ORDER_MENU_MOMENT_STATS_TTL_SECONDS:120}
    moment-viewer-state-ttl-seconds: ${ORDER_MENU_MOMENT_VIEWER_STATE_TTL_SECONDS:180}
    chat-message-ttl-seconds: 1800
    chat-recent-ttl-seconds: 1800
    unread-count-ttl-seconds: 300
    idempotency-pending-ttl-seconds: 120
    idempotency-success-ttl-seconds: 600

    realtime:
      presence-enabled: ${ORDER_MENU_PRESENCE_ENABLED:false}
      rate-limit-enabled: ${ORDER_MENU_RATE_LIMIT_ENABLED:false}
      online-ttl-seconds: ${ORDER_MENU_ONLINE_TTL_SECONDS:90}
      typing-ttl-seconds: ${ORDER_MENU_TYPING_TTL_SECONDS:8}
      login-limit: ${ORDER_MENU_LOGIN_LIMIT:10}
      login-window-seconds: ${ORDER_MENU_LOGIN_WINDOW_SECONDS:60}
      login-account-limit: ${ORDER_MENU_LOGIN_ACCOUNT_LIMIT:20}
      login-account-window-seconds: ${ORDER_MENU_LOGIN_ACCOUNT_WINDOW_SECONDS:300}
      order-create-limit: ${ORDER_MENU_ORDER_CREATE_LIMIT:5}
      order-create-window-seconds: ${ORDER_MENU_ORDER_CREATE_WINDOW_SECONDS:60}
      message-send-limit: ${ORDER_MENU_MESSAGE_SEND_LIMIT:60}
      message-send-window-seconds: ${ORDER_MENU_MESSAGE_SEND_WINDOW_SECONDS:60}
      moment-comment-limit: ${ORDER_MENU_MOMENT_COMMENT_LIMIT:30}
      moment-comment-window-seconds: ${ORDER_MENU_MOMENT_COMMENT_WINDOW_SECONDS:60}

management:
  health:
    redis:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
