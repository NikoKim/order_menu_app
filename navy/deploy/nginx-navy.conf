# SERVER-CONTEXT SNIPPET, not a standalone nginx.conf or a complete server block.
# Set the BaoTa site's document root to /www/wwwroot/navy/frontend first.
# Keep BaoTa's existing TLS, certificate renewal and security configuration.
# Replace conflicting location blocks instead of duplicating them.

client_max_body_size 3m;
gzip on;
gzip_min_length 1024;
gzip_vary on;
gzip_types application/json application/javascript text/css image/svg+xml;

location = /api/naval/live {
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
}

location ^~ /api/account/avatars/ {
    # Backend reads persistent /www/wwwroot/navy/assets, not frontend/assets.
    # Preserve its immutable cache headers for generated image URLs.
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}

location ^~ /api/ {
    # No trailing slash: preserve /api/ in the upstream request URI.
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}

location ^~ /assets/ {
    # Frontend build output only; do not alias the uploaded-avatar directory here.
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ^~ /naval/ {
    try_files $uri =404;
    expires 1d;
}

location = /index.html {
    add_header Cache-Control "no-cache" always;
}

location / {
    try_files $uri $uri/ /index.html;
}
