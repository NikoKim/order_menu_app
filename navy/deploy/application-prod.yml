# Loaded externally; do not package deployment secrets inside the JAR.
server:
  address: 127.0.0.1
  port: 8082
  forward-headers-strategy: native
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/css,application/javascript

spring:
  datasource:
    url: jdbc:mysql://${NAVY_DB_HOST:127.0.0.1}:${NAVY_DB_PORT:3306}/${NAVY_DB_NAME:navy}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${NAVY_DB_USER:navy_admin}
    password: ${NAVY_DB_PASSWORD}
  flyway:
    enabled: true
  mail:
    host: smtp.163.com
    port: 465
    username: ${NAVY_MAIL_USER:nju_zsj030702@163.com}
    password: ${NAVY_MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

app:
  mail:
    sender-name: ${NAVY_MAIL_SENDER_NAME:海战棋}
  avatar-directory: ${NAVY_AVATAR_DIRECTORY:/www/wwwroot/navy/assets}
  frontend-origin: ${NAVY_FRONTEND_ORIGIN}
  cors:
    allowed-origins:
      - ${NAVY_FRONTEND_ORIGIN}

logging:
  file:
    name: /www/wwwroot/navy/logs/navy.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
